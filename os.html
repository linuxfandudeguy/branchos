<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebShell OS 7</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/7.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="desktop"></div>
<div id="windows"></div>
<div class="taskbar" id="taskbar"></div>

<!-- Settings -->
<div id="settingsPanel" class="window-wrapper">
  <div class="window active">
    <div class="title-bar">
      <div class="title-bar-text">Settings</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleSettingsPanel()"></button>
      </div>
    </div>
    <div class="window-body">
        <label>Username</label>
        <input id="usernameInput" class="form-control" placeholder="Enter username">

        <label style="margin-top:10px;">Upload Wallpaper</label>
        <input type="file" id="wallpaperInput" class="form-control">

        <button class="btn btn-primary mt-2" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="apps.js"></script> <!-- Load apps dynamically -->
</body>
</html>
