<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wasmdsl</title>
<script src="./libv86.js"></script>
<style>
    /* Full viewport container */
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: black;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    /* Toolbar for Save/Restore buttons */
    #toolbar {
        margin: 5px;
        color: white;
        font-family: monospace;
        z-index: 10;
    }

    /* Screen container for v86 */
    #screen_container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        background-color: black;
    }

    /* Canvas styling */
    #screen_container canvas {
        display: block;
        width: 640px;   /* native VGA width */
        height: 480px;  /* native VGA height */
        image-rendering: pixelated; /* keeps text sharp when scaled */
        cursor: none;
        background-color: black;
    }

    /* Optional: make canvas scale on smaller screens */
    @media (max-width: 700px) {
        #screen_container canvas {
            width: 100%;
            height: auto;
        }
    }
</style>
</head>
<body>
    <!-- Toolbar -->
    <div id="toolbar">
        <input id="save_file" type="button" value="Save state to file">
        Restore from file: <input id="restore_file" type="file">
        <hr style="border-color: white;">
    </div>

    <!-- v86 Screen -->
    <div id="screen_container">
        <canvas></canvas>
    </div>

<script>
"use strict";

window.onload = function() {
    const screenContainer = document.getElementById("screen_container");

    // Initialize v86 emulator
    var emulator = new V86({
        screen_container: screenContainer,
        bios: { url: "./bios/seabios.bin" },
        vga_bios: { url: "./bios/vgabios.bin" },
        hda: { url: "./tilck-hda.img", async: true },
        autostart: true,
        mouse_relative: true,
        screen_adapter: "canvas",
        screen_width: 640,
        screen_height: 480
    });

    // Request pointer lock on click
    screenContainer.addEventListener("click", () => {
        if (document.pointerLockElement !== screenContainer) {
            screenContainer.requestPointerLock();
        }
    });

    // Save state to file
    document.getElementById("save_file").onclick = async function() {
        const new_state = await emulator.save_state();
        const a = document.createElement("a");
        a.download = "v86state.bin";
        a.href = window.URL.createObjectURL(new Blob([new_state]));
        a.dataset.downloadurl = "application/octet-stream:" + a.download + ":" + a.href;
        a.click();
        this.blur();
    };

    // Restore state from file
    document.getElementById("restore_file").onchange = function() {
        if (this.files.length) {
            const filereader = new FileReader();
            emulator.stop();

            filereader.onload = async function(e) {
                await emulator.restore_state(e.target.result);
                emulator.run();
            };

            filereader.readAsArrayBuffer(this.files[0]);
            this.value = "";
        }
        this.blur();
    };
};
</script>
</body>
</html>
