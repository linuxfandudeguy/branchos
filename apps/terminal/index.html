<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>terminal</title>
<script src="./libv86.js"></script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: black;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    #toolbar {
        margin: 5px;
        color: white;
        font-family: monospace;
        z-index: 10;
    }

    #screen_container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        background-color: black;
        position: relative;
    }
</style>
</head>
<body>
    <div id="toolbar">
        <input id="save_file" type="button" value="Save state to file">
        Restore from file: <input id="restore_file" type="file">
        <hr style="border-color: white;">
    </div>

    <div id="screen_container"></div>

<script>
"use strict";

window.onload = function() {
    const screenContainer = document.getElementById("screen_container");

    // Initialize emulator
    var emulator = new V86({
        screen_container: screenContainer,
        bios: { url: "./bios/seabios.bin" },
        vga_bios: { url: "./bios/vgabios.bin" },
        hda: { url: "./tilck-hda.img", async: true },
        autostart: true,
        mouse_relative: true,
        screen_adapter: "canvas",
        screen_width: 640,
        screen_height: 480
    });

    // Wait until v86 has created the canvas
    emulator.add_listener("screen-mode-change", function() {
        const canvas = emulator.screen.canvas;
        if (!canvas) return;

        // Automatically scale canvas to fit window while preserving 640x480 ratio
        function scaleCanvas() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const canvasRatio = 640 / 480;
            let scale;
            if(windowRatio > canvasRatio) {
                scale = window.innerHeight / 480;
            } else {
                scale = window.innerWidth / 640;
            }
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = "top left";
        }

        window.addEventListener("resize", scaleCanvas);
        scaleCanvas();
    });

    // Pointer lock on click
    screenContainer.addEventListener("click", () => {
        if (document.pointerLockElement !== screenContainer) {
            screenContainer.requestPointerLock();
        }
    });

    // Save state
    document.getElementById("save_file").onclick = async function() {
        const new_state = await emulator.save_state();
        const a = document.createElement("a");
        a.download = "v86state.bin";
        a.href = window.URL.createObjectURL(new Blob([new_state]));
        a.click();
        this.blur();
    };

    // Restore state
    document.getElementById("restore_file").onchange = function() {
        if(this.files.length){
            const reader = new FileReader();
            emulator.stop();
            reader.onload = async function(e){
                await emulator.restore_state(e.target.result);
                emulator.run();
            }
            reader.readAsArrayBuffer(this.files[0]);
            this.value = "";
        }
        this.blur();
    };
};
</script>
</body>
</html>
