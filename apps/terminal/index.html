<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wasmdsl</title>
<script src="./libv86.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#screen_container {
    width: 640px;      /* fixed VGA width */
    height: 480px;     /* fixed VGA height */
    background: black;
    margin: auto;
    position: relative;
}
</style>
</head>
<body>

<div id="screen_container"></div>

<script>
"use strict";

window.onload = function() {
    const container = document.getElementById("screen_container");
    if (!container) {
        console.error("screen_container not found!");
        return;
    }

    var emulator = new V86({
        screen_container: container,
        bios: { url: "./bios/seabios.bin" },
        vga_bios: { url: "./bios/vgabios.bin" },
        hda: { url: "./tilck-hda.img", async: true },
        autostart: true,
        mouse_relative: true,
        screen_adapter: "canvas",
        screen_width: 640,
        screen_height: 480
    });

    // Pointer lock
    container.addEventListener("click", () => {
        if (document.pointerLockElement !== container) {
            container.requestPointerLock();
        }
    });
};
</script>
</body>
</html>
