<!doctype html>
<title>wasmdsl</title>
<script src="./libv86.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: black;
    overflow: auto; /* allow scrolling if needed */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

#screen_container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 20px; /* optional spacing from top */
}

#screen_container canvas {
    display: block;
    width: 800px;   /* fixed width */
    height: 600px;  /* fixed height */
    cursor: none;   /* hide mouse cursor over the canvas */
    border: 2px solid #888; /* optional border to see edges */
}

#controls {
    margin-top: 10px;
    color: white;
    font-family: monospace;
}
</style>
<script>
"use strict";
window.onload = function() {
    var emulator = new V86({
        screen_container: document.getElementById("screen_container"),
        bios: { url: "./bios/seabios.bin" },
        vga_bios: { url: "./bios/vgabios.bin" },
        hda: { url: "./tilck-hda.img", async: true },
        autostart: true,
        mouse_relative: true
    });

    const screenContainer = document.getElementById("screen_container");
    // Request pointer lock on click
    screenContainer.addEventListener("click", () => {
        if (document.pointerLockElement !== screenContainer) {
            screenContainer.requestPointerLock();
        }
    });

    document.getElementById("save_file").onclick = async function() {
        const new_state = await emulator.save_state();
        var a = document.createElement("a");
        a.download = "v86state.bin";
        a.href = window.URL.createObjectURL(new Blob([new_state]));
        a.dataset.downloadurl = "application/octet-stream:" + a.download + ":" + a.href;
        a.click();
        this.blur();
    };

    document.getElementById("restore_file").onchange = function() {
        if(this.files.length) {
            var filereader = new FileReader();
            emulator.stop();
            filereader.onload = async function(e) {
                await emulator.restore_state(e.target.result);
                emulator.run();
            };
            filereader.readAsArrayBuffer(this.files[0]);
            this.value = "";
        }
        this.blur();
    };
};
</script>

<div id="controls">
    <input id="save_file" type="button" value="Save state to file">
    Restore from file: <input id="restore_file" type="file">
</div>

<hr>

<div id="screen_container">
    <canvas></canvas>
</div>
